on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      args:
        type: string
        required: false
        description: 'Args'
        default: ''

  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: main

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: data
          path: ./data

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          install: true
          cache: true

      - run: node ./src/main.ts ${{ inputs.args }}
        env:
          DEFAULT_WEBHOOK_URL: ${{ secrets.DEFAULT_WEBHOOK_URL }}
          FORUM_WEBHOOK_URL: ${{ secrets.FORUM_WEBHOOK_URL }}
          TRANS_WEBHOOK_URL: ${{ secrets.TRANS_WEBHOOK_URL }}
          OPENROUTER_WEBHOOK_URL: ${{ secrets.OPENROUTER_WEBHOOK_URL }}

      - run: |
          cd data
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git pull
            git commit -m "Run"
            git push
          fi
